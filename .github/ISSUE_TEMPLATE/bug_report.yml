name: Bug Report
description: File a bug report to help improve Maidan Desk
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to fill out this bug report!
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Where did you observe this bug? (e.g. Live Vercel, Localhost, Node version, Browser)
      placeholder: e.g., Chrome 120 on Windows 11, Live Deployment
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How do we reproduce the issue?
      placeholder: |
        1. Login as 'coach'
        2. Navigate to '/app' -> Sessions
        3. Click 'New Session'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

